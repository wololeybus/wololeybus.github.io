<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 yükleniyor…</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f0f2f5;color:#2c3e50;display:grid;place-items:center;min-height:100vh;margin:0}.msg{padding:24px;text-align:center}
</style>
</head>
<body>
<div class="msg">2026 müfredatı yükleniyor…</div>
<script>
(async function(){
  try {
    const response = await fetch('2025_phys.html', {cache:'no-store'});
    if (!response.ok) throw new Error('2025_phys.html bulunamadı');
    let html = await response.text();

    // 2025'in mevcut kodunu aynen kullan; yalnızca yıl bilgisini 2026 yap.
    html = html.replace(/2025/g, '2026');

    const gradeOptions = '<option value="">-</option><option value="AA">AA</option><option value="BA">BA</option><option value="BB">BB</option><option value="CB">CB</option><option value="CC">CC</option><option value="DC">DC</option><option value="DD">DD</option><option value="FD">FD</option><option value="FF">FF</option><option value="NA">NA</option>';

    const ohs101 = '<tr data-static="true"><td class="c-code">OHS 101</td><td>İş Sağlığı ve Güvenliği I</td><td><input type="number" value="1" readonly class="credit-input"></td><td><select class="grade-select">'+gradeOptions+'</select></td><td></td></tr>';
    const ohs102 = '<tr data-static="true"><td class="c-code">OHS 102</td><td>İş Sağlığı ve Güvenliği I</td><td><input type="number" value="1" readonly class="credit-input"></td><td><select class="grade-select">'+gradeOptions+'</select></td><td></td></tr>';

    // ENG 101 ve ENG 102 satırlarının hemen arkasına 2026'da eklenen OHS derslerini yerleştir.
    html = html.replace(/(<tr data-static="true"><td class="c-code">ENG 101<\/td>[\s\S]*?<\/tr>)/, '$1' + ohs101);
    html = html.replace(/(<tr data-static="true"><td class="c-code">ENG 102<\/td>[\s\S]*?<\/tr>)/, '$1' + ohs102);

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = '<div class="msg"><h2>2026 sayfası yüklenemedi</h2><p><b>2025_phys.html</b> dosyasının repo kökünde olduğundan emin ol.</p><p>'+String(err.message || err)+'</p></div>';
  }
})();
</script>
</body>
</html>
