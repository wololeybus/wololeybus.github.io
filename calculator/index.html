<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MRHS1P0EK6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-MRHS1P0EK6');
    </script>

    <meta charset="UTF-8">
    <meta name="description" content="İYTE Fizik GPA hesaplama asistanı">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İYTE Fizik GPA Asistanı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --iyte-red: #d32f2f;
            --text-color: #ecf0f1;
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --button-bg: #2c2c2c;
            --button-border: #444;
            --subtitle-color: #bdc3c7;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body.light-mode {
            --iyte-red: #b30000;
            --text-color: #2c3e50;
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --button-bg: #ffffff;
            --button-border: #ddd;
            --subtitle-color: #7f8c8d;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle-btn,
        .home-btn {
            position: fixed;
            top: 20px;
            background: var(--container-bg);
            border: 2px solid var(--iyte-red);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.3s, color 0.3s;
            box-shadow: 0 2px 5px var(--shadow);
            text-decoration: none;
            z-index: 10;
        }

        .theme-toggle-btn {
            right: 20px;
            font-size: 1.2rem;
        }

        .home-btn {
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle-btn:hover,
        .home-btn:hover {
            transform: scale(1.05);
        }

        .container {
            background: var(--container-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px var(--shadow);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border-top: 5px solid var(--iyte-red);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            color: var(--iyte-red);
            margin: 0 0 6px;
        }

        .subtitle {
            color: var(--subtitle-color);
            font-size: 0.95rem;
            margin: 0;
        }

        .question {
            margin: 30px 0 14px;
            font-weight: 700;
            font-size: 1rem;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .year-btn {
            background: var(--button-bg);
            color: var(--text-color);
            border: 2px solid var(--button-border);
            padding: 16px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 700;
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
        }

        .year-btn:hover,
        .year-btn:focus-visible {
            border-color: var(--iyte-red);
            transform: translateY(-2px);
            outline: none;
        }

        .year-btn:last-child {
            grid-column: 1 / -1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px;
                margin-top: 54px;
            }

            .year-grid {
                grid-template-columns: 1fr;
            }

            .year-btn:last-child {
                grid-column: auto;
            }

            .theme-toggle-btn,
            .home-btn {
                top: 12px;
                padding: 9px 12px;
            }

            .theme-toggle-btn {
                right: 12px;
            }

            .home-btn {
                left: 12px;
            }

            .home-btn span {
                display: none;
            }
        }
    </style>
</head>

<body>
    <a class="home-btn" href="../" title="Ana sayfaya dön" aria-label="Ana sayfaya dön">
        <i class="fas fa-arrow-left"></i>
        <span>Ana sayfa</span>
    </a>

    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir" aria-label="Temayı değiştir">
        <i class="fas fa-sun"></i> / <i class="fas fa-moon"></i>
    </button>

    <main class="container">
        <h1>İYTE Fizik GPA Asistanı</h1>
       <p class="subtitle">2021–2026 girişli Fizik öğrencileri için</p>

<p class="question">İYTE Fizik bölümüne giriş yılını seç:</p>

<div class="year-grid">
    <a class="year-btn" href="/2021_phys.html">2021 (numara başı 29)</a>
    <a class="year-btn" href="/2022_phys.html">2022 (numara başı 30)</a>
    <a class="year-btn" href="/2023_phys.html">2023 (numara başı 31)</a>
    <a class="year-btn" href="/2024_phys.html">2024 (numara başı 32)</a>
    <a class="year-btn" href="/2025_phys.html">2025 (numara başı 33)</a>
    <a class="year-btn" href="/2026_phys.html">2026 (numara başı 34)</a>
</div>
    </main>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function getCurrentSemester() {
            const month = new Date().getMonth() + 1;

            if (month >= 9 || month === 1) return '1';
            if (month >= 2 && month <= 6) return '2';
            return '0';
        }

        function routeUser(entryYear) {
            const semester = getCurrentSemester();

            // calculator/index.html içinden repo kökündeki müfredat sayfalarına çık.
            const targetFile = `../${entryYear}_phys.html`;

            console.log(`Giriş Yılı: ${entryYear}, Yönlendirilen Dosya: ${targetFile}`);

            window.location.href = `${targetFile}?entry=${entryYear}&sem=${encodeURIComponent(semester)}`;
        }
    </script>
</body>
</html>
